[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "news-agent"
version = "0.1.0"
description = "Multi-agent CLI that aggregates tech news and generates a Claude-written digest"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Narita" }]
keywords = ["cli", "agents", "asyncio", "claude", "llm", "news-aggregator"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typer[all]>=0.12",
    "pydantic>=2",
    "pydantic-settings>=2",
    "anthropic>=0.28",
    "httpx>=0.27",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/Lucas-Narita/news-agent"
Repository = "https://github.com/Lucas-Narita/news-agent"
Issues = "https://github.com/Lucas-Narita/news-agent/issues"

[project.scripts]
news-agent = "news_agent.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "respx>=0.20",
]

[tool.setuptools.packages.find]
include = ["news_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=news_agent --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["news_agent"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
